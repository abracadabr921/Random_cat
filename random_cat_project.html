<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random cat project</title>
    <style>
        body{
            text-align: center;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        div{
            width: 49%;
            margin: 20px auto;
            padding: 30px;  
            border-radius: 20px;
            box-shadow: 0 0 10px grey;
            transition: .2s;
        }
        
       

        img{
            width: 100%;
            height: 100%;
        }
        .btn{
            width: 150px;
            height: 40px;
            border-style: none;
            font-family: Arial, Helvetica, sans-serif;
            
            
            box-shadow:  0 0 6px grey;
            transition: .2s;
        }
        .btn:hover{
            width: 170px;
            height: 50px;
        }
        .btn:active{
            background-color: grey;
            width: 160px;
            height: 45px;
        }
        span{
            transition: .2s;
            
        }
        span:hover{
            font-size: 40px;
        }
        
    </style>
</head>
<body>
    <h1><span>Random Cat Project</span></h1>
    <div>
        <img src="https://randomoutputs.com/assets/images/tools/cats/york-chocolate.webp" alt="cat"  class="img">
    </div>
    <input type="button" value="Generate Random Cat" class="btn" onclick="fetchHandler()">
    


    <script>
        const image = document.querySelector('.img');
        const url = "https://api.thecatapi.com/v1/images/search";

        async function fetchHandler(){


                try{
                    const response = await fetch(url);
                    const data = await response.json();

                    image.src = data[0].url;

                } catch(error){
                    console.log('error');
                }

        }

    </script> 
</body>

</html>
